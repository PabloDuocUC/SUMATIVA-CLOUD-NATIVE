spring.application.name=tickets-service
server.port=8080

# --- Almacenamiento temporal en EFS ---
# En EC2 el EFS se monta en /mnt/efs y el contenedor lo ve en /app/efs
# (docker run -v /mnt/efs:/app/efs). Los tickets se generan en <ruta>/tickets.
app.efs.ruta=${EFS_PATH:/app/efs}

# --- Amazon S3 ---
app.s3.bucket=${S3_BUCKET:tickets-eventos-bucket}
app.s3.region=${AWS_REGION:us-east-1}

# --- Base de datos de metadatos (H2 en archivo, persiste entre despliegues) ---
spring.datasource.url=jdbc:h2:file:${DATA_PATH:/app/data}/ticketsdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Mensajes de error claros en las respuestas
server.error.include-message=always
