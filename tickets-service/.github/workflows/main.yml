name: CI/CD Tickets Service

# El pipeline se ejecuta con cada push a la rama principal
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGEN: ${{ secrets.DOCKERHUB_USERNAME }}/tickets-service

jobs:
  # Pruebas automaticas de todos los endpoints (EFS y S3 simulados, no usa AWS)
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn -B test

  # Construye la imagen, la publica en Docker Hub y la despliega en EC2
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar la imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}

      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # 1. Montar el EFS en /mnt/efs si aun no esta montado
            sudo mkdir -p /mnt/efs
            if ! mountpoint -q /mnt/efs; then
              sudo mount -t nfs4 -o nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport ${{ secrets.EFS_DNS }}:/ /mnt/efs
            fi
            # que se vuelva a montar solo si la instancia se reinicia
            if ! grep -q "${{ secrets.EFS_DNS }}" /etc/fstab; then
              echo "${{ secrets.EFS_DNS }}:/ /mnt/efs nfs4 nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,_netdev,nofail 0 0" | sudo tee -a /etc/fstab
            fi
            df -h /mnt/efs

            # 2. Descargar la imagen nueva y reemplazar el contenedor
            mkdir -p /home/ec2-user/tickets-data
            docker pull ${{ env.IMAGEN }}:latest
            docker rm -f tickets-service 2>/dev/null || true
            docker run -d --name tickets-service \
              --restart unless-stopped \
              --network host \
              -v /mnt/efs:/app/efs \
              -v /home/ec2-user/tickets-data:/app/data \
              -e S3_BUCKET=${{ secrets.S3_BUCKET }} \
              -e AWS_REGION=us-east-1 \
              ${{ env.IMAGEN }}:latest
            docker image prune -f

            # 3. Verificar que la aplicacion responde
            for intento in $(seq 1 30); do
              if curl -fs http://localhost:8080/api/efs/archivos > /dev/null; then
                echo "Aplicacion desplegada y respondiendo"
                exit 0
              fi
              sleep 3
            done
            echo "La aplicacion no respondio a tiempo"
            docker logs --tail 80 tickets-service
            exit 1
